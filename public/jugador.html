<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QUADTREE ARENA · Jugador</title><link rel="stylesheet" href="/style.css"><script src="/socket.io/socket.io.js"></script><script src="/common.js"></script></head><body>
<header><div><h1>QUADTREE ARENA</h1><p>Vista del jugador · juega desde tu celular</p></div><nav class="topnav"><a href="/equipos.html">Equipos</a><a href="/proyector.html">Proyector</a></nav></header>
<main><div class="panel"><h2>Entrar como jugador</h2><div class="toolbar"><div class="field"><label>Código de sala</label><input id="code" placeholder="Código de partida"></div><div class="field"><label>Tu nombre</label><input id="playerName" maxlength="28" placeholder="Nombre"></div><div class="field"><label>Equipo</label><select id="team"><option value="0">Alfa</option><option value="1">Beta</option><option value="2">Gamma</option></select></div><div class="field"><label>Cuadrante</label><select id="role"><option>NO</option><option>NE</option><option>SO</option><option>SE</option></select></div><button id="join">Entrar al juego</button></div><div id="notice"></div></div>
<div id="game" class="panel hidden"><div class="player-title"><div><h2 id="heading">Tu turno</h2><p class="sub" id="meta"></p></div><div class="statbox"><small>Puntos del equipo</small><strong id="score">0</strong></div></div><div id="notice"></div><div id="challenge"></div></div></main>
<script>
document.getElementById("join").onclick=()=>{const code=document.getElementById("code").value.trim().toUpperCase();if(!code)return setNotice("Escribe el código de la sala.");socket.emit("joinRoom",{code,kind:"player",name:document.getElementById("playerName").value||"Jugador",teamIndex:Number(document.getElementById("team").value),role:document.getElementById("role").value})};
if(codeFromUrl)document.getElementById("code").value=codeFromUrl;
function renderPage(){if(myTeam===null||myTeam===undefined||!state)return;document.getElementById("game").classList.remove("hidden");const team=state.teams[myTeam];document.getElementById("heading").textContent=`Equipo ${team.name} · jugador ${myRole}`;document.getElementById("meta").textContent=`Eres responsable de ${myRole} y de todas sus subdivisiones.`;document.getElementById("score").textContent=team.points;const owned=team.nodes.filter(n=>n.owner===myRole&&n.status==="pending").sort((a,b)=>b.size-a.size);const n=owned[0],area=document.getElementById("challenge");if(!n){area.innerHTML=`<div class="notice success">${team.nodes.every(x=>x.status!=="pending")?"¡El equipo completó el árbol!":"Tu rama está al día. Espera a que continúe la partida."}</div>`;return}
if(n.verifiedHetero){const ks=children(n);area.innerHTML=`<div class="challenge"><h3>Reto 2 · Clasifica los cuatro hijos</h3><p>La región <b>${n.id}</b> es heterogénea. Decide si cada hijo es homogéneo o heterogéneo.</p><div class="region">${regionSvg(n,18)}</div><div class="children">${ks.map(k=>`<div class="child"><b>${k.id.split("-").pop()} · ${k.size}×${k.size}</b><div class="region">${regionSvg(k,Math.min(22,90/k.size))}</div><select data-answer="${k.id}"><option value="">Selecciona...</option><option value="H">Homogénea</option><option value="X">Heterogénea</option></select></div>`).join("")}</div><button class="good" id="sendChildren" style="width:100%;margin-top:12px">Comprobar los cuatro</button></div>`;document.getElementById("sendChildren").onclick=()=>{const a=ks.map(k=>document.querySelector(`[data-answer="${k.id}"]`).value);if(a.some(x=>!x))return setNotice("Clasifica los cuatro cuadrantes.", "error");socket.emit("classifyChildren",{nodeId:n.id,answers:a})};return}
area.innerHTML=`<div class="challenge"><h3>Reto 1 · Analiza tu región</h3><p>¿La región <b>${n.id}</b> es homogénea (todos sus píxeles tienen el mismo color) o heterogénea?</p><div class="region">${regionSvg(n,Math.min(28,320/n.size))}</div><div class="choices"><button class="good" id="homogeneous">Homogénea</button><button class="danger" id="heterogeneous">Heterogénea</button></div></div>`;document.getElementById("homogeneous").onclick=()=>socket.emit("classify",{nodeId:n.id,homogeneous:true});document.getElementById("heterogeneous").onclick=()=>socket.emit("classify",{nodeId:n.id,homogeneous:false})}
</script></body></html>
