<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QUADTREE ARENA · Proyector</title><link rel="stylesheet" href="/style.css"><script src="/socket.io/socket.io.js"></script><script src="/common.js"></script></head><body>
<header><div><h1>QUADTREE ARENA</h1><p>Proyector · los tres equipos en competencia</p></div><nav class="topnav"><a href="/equipos.html">Equipos</a><a href="/proyector.html">Proyector</a><a href="/jugador.html">Jugador</a></nav></header>
<main><div class="toolbar"><div class="field"><label>Código de sala</label><input id="code" placeholder="Código de partida"></div><button id="connect">Conectar proyector</button><button class="secondary" id="fullscreen">Pantalla completa</button></div><div id="notice"></div><div class="stats" id="totals"></div><div class="boardgrid" id="boards"></div><div class="legend"><span><i class="dot" style="background:white"></i>Blanco</span><span><i class="dot" style="background:#111"></i>Negro</span><span><i class="dot" style="background:#8b0000"></i>Rojo oscuro</span><span><i class="dot" style="background:#39ff14"></i>Líneas de subdivisión</span></div></main>
<script>
document.getElementById("connect").onclick=()=>joinViewer("projector");document.getElementById("fullscreen").onclick=()=>document.documentElement.requestFullscreen?.();
if(codeFromUrl){document.getElementById("code").value=codeFromUrl;joinViewer("projector")}
function renderPage(){if(!state)return;document.getElementById("totals").innerHTML=state.teams.map(t=>`<div class="statbox"><small>Equipo ${t.name}</small><strong>${t.points} puntos</strong><div class="muted">${t.nodes.filter(n=>n.status==="pending").length} pendientes · ${t.nodes.filter(n=>n.status==="leaf").length} hojas</div></div>`).join("");document.getElementById("boards").innerHTML=state.teams.map(t=>`<div class="board"><h3>Equipo ${t.name}</h3><div class="score">${t.points} puntos</div><div class="canvas">${boardSvg(t)}</div><div class="slots" style="margin-top:8px">${["NO","NE","SO","SE"].map(r=>{let p=t.players[r];return `<div class="slot"><b>${r}</b><span>${p?p.name+(p.online?" · ●":" · ○"):"Vacante"}</span></div>`}).join("")}</div></div>`).join("")}
</script></body></html>
